<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Yalnızca root bu adı sahiplenebilir. -->
  <policy user="root">
    <allow own="id.liwinux.Helper1"/>
  </policy>

  <!-- Herkes ÇAĞIRABİLİR; asıl yetkilendirme polkit'te yapılır.
       Bu bilinçli bir tasarım: D-Bus politikası kaba (kullanıcı bazlı),
       polkit ise oturum aktifliğini ve yönetici kimliğini değerlendirebilir. -->
  <policy context="default">
    <allow send_destination="id.liwinux.Helper1"
           send_interface="id.liwinux.Helper1"/>
    <allow send_destination="id.liwinux.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="id.liwinux.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
