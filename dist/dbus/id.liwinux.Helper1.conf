<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own this name. -->
  <policy user="root">
    <allow own="id.liwinux.Helper1"/>
  </policy>

  <!-- Anyone MAY CALL; the real authorization happens in polkit.
       This is deliberate: D-Bus policy is coarse (per user), while polkit can
       evaluate session activity and administrator identity. -->
  <policy context="default">
    <allow send_destination="id.liwinux.Helper1"
           send_interface="id.liwinux.Helper1"/>
    <allow send_destination="id.liwinux.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="id.liwinux.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
