[package]
name = "liw-input"
description = "Keyboard/mouse to Android touch mapping engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2.189"
evdev = { version = "0.13.2", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "fs", "sync"] }
toml = { version = "1.1.4", features = ["parse", "display"] }
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
