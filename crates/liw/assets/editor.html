<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>liwinux — profile editor</title>
<style>
:root{
  --bg:#0f1115; --panel:#161a21; --line:#262c36; --fg:#e7eaf0; --mut:#8d96a5;
  --acc:#4da3ff; --ok:#35d07f; --warn:#ffb020; --bad:#ff5c5c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;overflow:hidden}

/* ---------- sidebar ---------- */
#side{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column}
#head{padding:12px 14px;border-bottom:1px solid var(--line)}
#head h1{margin:0;font-size:15px}
#head .pkg{color:var(--mut);font-size:11px;font-family:ui-monospace,monospace;
  word-break:break-all}
#addbar{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}
#list{flex:1;overflow-y:auto;padding:8px 10px}
#foot{padding:10px 12px;border-top:1px solid var(--line)}

.card{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
  background:#12161d;overflow:hidden}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card>.top{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
.card>.top:hover{background:#1a1f28}
.card .nm{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.tag{font-size:10px;padding:1px 6px;border-radius:99px;background:#222935;
  color:var(--mut);text-transform:uppercase;letter-spacing:.4px;flex:none}
.card .body{padding:2px 10px 10px;border-top:1px solid var(--line);display:none}
.card.sel .body{display:block}

/* Key badges in the header: so a key can be changed WITHOUT opening the card.
   That is the most common action; burying it at the bottom made it invisible. */
.keys{display:flex;gap:3px;flex:none}
.kb{font:600 10px/1.6 ui-monospace,monospace;padding:0 5px;border-radius:4px;
  background:#232b37;border:1px solid #313a48;color:var(--fg);cursor:pointer;
  min-width:20px;text-align:center}
.kb:hover{border-color:var(--acc);color:var(--acc)}
.kb.none{color:var(--warn);border-color:#4a3a18;background:#2a2314}
.kb.dup{color:#fff;background:#7a2230;border-color:var(--bad)}
.kb.opt{color:var(--mut);font-weight:400}
.xbtn{flex:none;border:0;background:none;color:var(--mut);font-size:15px;
  line-height:1;padding:2px 4px;cursor:pointer;border-radius:4px}
.xbtn:hover{background:#3a2427;color:var(--bad)}
.nmedit{font:inherit;font-weight:650;background:#0d1015;color:var(--fg);
  border:1px solid var(--acc);border-radius:4px;padding:1px 5px;width:100%}
#conflict{color:var(--bad);font-size:11px;padding:6px 12px 0;display:none}

.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.row label{width:82px;flex:none;color:var(--mut);font-size:11px}
.row .val{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut)}
input[type=text],input[type=number],select{background:#0d1015;color:var(--fg);
  border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:inherit;
  min-width:0;width:100%}
input[type=number]{font-family:ui-monospace,monospace}
input[type=range]{width:100%;accent-color:var(--acc)}
.xy{display:flex;gap:6px;flex:1}
.xy>div{flex:1;display:flex;align-items:center;gap:4px}
.xy span{color:var(--mut);font-size:10px}

button{border:1px solid var(--line);border-radius:6px;background:#1b212b;color:var(--fg);
  padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:#232b37}
button.p{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:700}
button.p:hover{filter:brightness(1.08)}
button.d{color:var(--bad);border-color:#3a2427}
button.wide{width:100%}
button.key{font-family:ui-monospace,monospace;text-align:left}
button.key.none{color:var(--warn);border-color:#3a3020}

#msg{margin-top:8px;font-size:12px;min-height:32px;white-space:pre-wrap}
#msg.ok{color:var(--ok)} #msg.bad{color:var(--bad)}

/* ---------- sahne ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none;flex-wrap:wrap}
#bar .sp{flex:1}
#readout{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);
  white-space:nowrap}
#readout b{color:var(--fg)}
#view{flex:1;position:relative;overflow:hidden;background:#07090c;
  cursor:grab;touch-action:none}
#view.pan{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#canvas img{display:block;image-rendering:auto}
#ov{position:absolute;inset:0;pointer-events:none}

.mk{position:absolute;pointer-events:auto;cursor:grab;
  transform:translate(-50%,-50%);z-index:3}
.mk .dot{width:16px;height:16px;border-radius:50%;
  border:2px solid #fff;background:rgba(77,163,255,.7);
  box-shadow:0 0 0 2px rgba(0,0,0,.75)}
.mk.sel .dot{background:rgba(53,208,127,.85);border-color:#fff;
  width:18px;height:18px}
.mk .tip{position:absolute;left:14px;top:-6px;white-space:nowrap;font-size:11px;
  background:rgba(0,0,0,.8);border:1px solid var(--line);padding:1px 6px;
  border-radius:4px}
.ring{position:absolute;border:2px dashed rgba(77,163,255,.65);border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.guide{position:absolute;background:rgba(53,208,127,.45);pointer-events:none;z-index:1}
#link{position:absolute;inset:0;pointer-events:none;z-index:1}

#loupe{position:absolute;width:180px;height:180px;border-radius:50%;
  border:2px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.7);
  display:none;z-index:9;pointer-events:none;background:#000}

/* ---------- key capture ---------- */
#grab{position:fixed;inset:0;background:rgba(6,8,12,.86);z-index:50;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#grab .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:26px 34px;text-align:center;max-width:420px}
#grab h2{margin:0 0 6px;font-size:16px}
#grab p{margin:0;color:var(--mut);font-size:12px}
kbd{background:#222935;border:1px solid var(--line);border-radius:4px;
  padding:0 5px;font-family:ui-monospace,monospace;font-size:11px}
.hint{color:var(--mut);font-size:11px;margin-top:6px}
</style></head><body>

<aside id="side">
  <div id="head"><h1 id="pname">…</h1><div class="pkg" id="ppkg"></div></div>
  <div id="addbar">
    <input type="text" id="newname" placeholder="new binding name">
    <select id="newtype" style="width:110px">
      <option value="tap">tap</option>
      <option value="toggle">toggle</option>
      <option value="joystick">joystick</option>
      <option value="swipe">swipe</option>
      <option value="aim">aim</option>
    </select>
    <button id="add">Ekle</button>
  </div>
  <div class="hint" style="padding:0 12px 8px">
    Click a key badge -> change the key · click the name -> rename ·
    <b>×</b> -> delete.  Click the image -> move the selected point there.
    Arrow keys move 1 px (<kbd>Shift</kbd> 10).
  </div>
  <div id="conflict"></div>
  <div id="list"></div>
  <div id="foot">
    <div style="display:flex;gap:6px">
      <button id="save" style="flex:1">Kaydet</button>
      <button class="p" id="apply" style="flex:1.4">Kaydet ve uygula</button>
    </div>
    <div id="msg"></div>
  </div>
</aside>

<main>
  <div id="bar">
    <button id="fit">Fit</button>
    <button id="one">1:1</button>
    <button id="zout">−</button>
    <button id="zin">+</button>
    <span class="val" id="zlbl">%100</span>
    <span class="sp"></span>
    <span id="readout">—</span>
    <span class="sp"></span>
    <button id="reshot">Refresh image</button>
    <button id="test">Touch selected</button>
  </div>
  <div id="view">
    <div id="canvas"><img id="shot" alt=""></div>
    <div id="ov"><svg id="link"></svg></div>
    <canvas id="loupe" width="180" height="180"></canvas>
  </div>
</main>

<div id="grab"><div class="box">
  <h2 id="gtitle">Press a key</h2>
  <p>Press a keyboard key, click a mouse button or turn the wheel.<br>
     <kbd>Esc</kbd> iptal eder.</p>
</div></div>

<script>
"use strict";

/* ============================================================
   evdev key codes
   The profile stores the PHYSICAL key code (independent of layout).
   The browser's `event.code` is physical too — that is why the mapping
   is stable and layout independent. `event.key` CANNOT be used: on a
   Turkish layout the "i" key produces a different letter but is the same physical key.
   ============================================================ */
const EVDEV = {
  Escape:1, Digit1:2, Digit2:3, Digit3:4, Digit4:5, Digit5:6, Digit6:7,
  Digit7:8, Digit8:9, Digit9:10, Digit0:11, Minus:12, Equal:13, Backspace:14,
  Tab:15, KeyQ:16, KeyW:17, KeyE:18, KeyR:19, KeyT:20, KeyY:21, KeyU:22,
  KeyI:23, KeyO:24, KeyP:25, BracketLeft:26, BracketRight:27, Enter:28,
  ControlLeft:29, KeyA:30, KeyS:31, KeyD:32, KeyF:33, KeyG:34, KeyH:35,
  KeyJ:36, KeyK:37, KeyL:38, Semicolon:39, Quote:40, Backquote:41,
  ShiftLeft:42, Backslash:43, KeyZ:44, KeyX:45, KeyC:46, KeyV:47, KeyB:48,
  KeyN:49, KeyM:50, Comma:51, Period:52, Slash:53, ShiftRight:54,
  NumpadMultiply:55, AltLeft:56, Space:57, CapsLock:58,
  F1:59, F2:60, F3:61, F4:62, F5:63, F6:64, F7:65, F8:66, F9:67, F10:68,
  NumLock:69, ScrollLock:70, Numpad7:71, Numpad8:72, Numpad9:73,
  NumpadSubtract:74, Numpad4:75, Numpad5:76, Numpad6:77, NumpadAdd:78,
  Numpad1:79, Numpad2:80, Numpad3:81, Numpad0:82, NumpadDecimal:83,
  IntlBackslash:86, F11:87, F12:88, IntlRo:89, Convert:92, KanaMode:93,
  NonConvert:94, NumpadEnter:96, ControlRight:97, NumpadDivide:98,
  PrintScreen:99, AltRight:100, Home:102, ArrowUp:103, PageUp:104,
  ArrowLeft:105, ArrowRight:106, End:107, ArrowDown:108, PageDown:109,
  Insert:110, Delete:111, AudioVolumeMute:113, AudioVolumeDown:114,
  AudioVolumeUp:115, NumpadEqual:117, Pause:119, NumpadComma:121,
  Lang1:122, Lang2:123, IntlYen:124, MetaLeft:125, MetaRight:126,
  ContextMenu:127
};
const CODE2NAME = {};
for (const [code, ev] of Object.entries(EVDEV)) if (!(ev in CODE2NAME)) CODE2NAME[ev] = code;
/* Readable labels — a code number means nothing to the user. */
const PRETTY = {
  1:'Esc', 14:'Backspace', 15:'Tab', 28:'Enter', 29:'Sol Ctrl', 42:'Sol Shift',
  54:'Right Shift', 56:'Left Alt', 57:'Space', 58:'CapsLock', 97:'Right Ctrl',
  100:'Right Alt', 103:'Up', 105:'Left', 106:'Right', 108:'Down',
  125:'Left Meta', 126:'Right Meta', 41:'Backquote (`)'
};
function trigLabel(t) {
  if (t == null) return 'unassigned';
  if (typeof t === 'string') return {
    MouseLeft:'Mouse Left', MouseRight:'Mouse Right', MouseMiddle:'Mouse Middle',
    WheelUp:'Tekerlek ↑', WheelDown:'Tekerlek ↓' }[t] || t;
  const c = t.Key;
  if (!c) return 'unassigned';
  if (PRETTY[c]) return PRETTY[c] + '  (' + c + ')';
  const n = CODE2NAME[c] || '?';
  return n.replace(/^Key|^Digit/, '') + '  (' + c + ')';
}
const UNSET = () => ({ Key: 0 });
const isUnset = t => t == null || (typeof t === 'object' && !t.Key);
/// Short label for a badge. Space is tight in the header; "Left Ctrl (29)" does not fit.
function shortLabel(t) {
  if (t == null) return '—';
  if (typeof t === 'string') return {
    MouseLeft:'M1', MouseRight:'M2', MouseMiddle:'M3',
    WheelUp:'W↑', WheelDown:'W↓' }[t] || t;
  const c = t.Key;
  if (!c) return '?';
  const short = { 1:'Esc', 14:'⌫', 15:'Tab', 28:'⏎', 29:'Ctrl', 42:'Shift',
    54:'RShift', 56:'Alt', 57:'Space', 58:'Caps', 97:'RCtrl', 100:'RAlt',
    103:'↑', 105:'←', 106:'→', 108:'↓', 41:'`' }[c];
  if (short) return short;
  const n = CODE2NAME[c] || ('#' + c);
  return n.replace(/^Key|^Digit|^Numpad/, '') || ('#' + c);
}
/// Bindings sharing the same trigger.
///
/// Rejecting at save time is not enough: the user then has to hunt for which
/// two collide. Showing the collision WHILE EDITING prevents the mistake from
/// being made at all.
function conflicts() {
  const seen = {}, dup = {};
  for (const [name, b] of Object.entries(B)) {
    for (const [f] of triggersOf(b)) {
      const t = b[f];
      if (isUnset(t)) continue;
      const k = JSON.stringify(t);
      if (seen[k]) { (dup[k] = dup[k] || [seen[k]]).push(name); }
      else seen[k] = name;
    }
  }
  return dup;
}

/* ============================================================ */
const $ = s => document.querySelector(s);
const view = $('#view'), canvas = $('#canvas'), img = $('#shot'),
      ov = $('#ov'), link = $('#link'), loupe = $('#loupe'), lctx = loupe.getContext('2d');

let S = null;               // sunucu durumu
let B = {};                 // name -> binding (the edited copy)
let sel = null;             // selected binding name
let selPt = null;           // selected point field ('at' | 'center' | 'from' ...)
let scale = 1, tx = 0, ty = 0;
let dirty = false;

/* --- coordinate conversion ------------------------------------
   The single source of truth. The image sits at SOURCE pixel size and
   the scale is only a CSS transform; coordinates are always converted
   back to source pixels. So whatever zoom you work at, the value written
   to the profile stays the same — the fit scale causes no drift.       */
const toScreen = (nx, ny) => [nx * S.width * scale + tx, ny * S.height * scale + ty];
const toNorm = (sx, sy) => [((sx - tx) / scale) / S.width, ((sy - ty) / scale) / S.height];
const clamp01 = v => Math.min(1, Math.max(0, v));
const px = (n, size) => Math.round(n * size);

function applyView() {
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  $('#zlbl').textContent = '%' + Math.round(scale * 100);
  placeMarkers();
}
/// Has the fit been done on a REAL layout yet?
///
/// This actually happened: when `xdg-open` opened the page in a background
/// tab, `#view` measured 0x0, `scale` came out 0 and the editor was entirely
/// blank — and it did not fix itself when you switched to the tab.
let fitted = false;
function fitView() {
  const r = view.getBoundingClientRect();
  // Measuring at zero size produces scale=0 and destroys everything.
  // If the measurement is meaningless DO NOT TOUCH it; ResizeObserver
  // will call again when the real size arrives.
  if (r.width < 2 || r.height < 2) return;
  scale = Math.min(r.width / S.width, r.height / S.height);
  tx = (r.width - S.width * scale) / 2;
  ty = (r.height - S.height * scale) / 2;
  fitted = true;
  applyView();
}
function zoomAt(cx, cy, f) {
  const ix = (cx - tx) / scale, iy = (cy - ty) / scale;
  scale = Math.min(16, Math.max(0.05, scale * f));
  tx = cx - ix * scale; ty = cy - iy * scale;
  applyView();
}

/* --- editable points per binding ------------------------------ */
function pointsOf(b) {
  switch (b.type) {
    case 'tap': case 'toggle': return [['at', '']];
    case 'aim': return [['origin', 'origin']];
    case 'joystick': return [['center', 'merkez']];
    case 'swipe': return [['from', 'from'], ['to', 'to']];
    default: return [];
  }
}
function triggersOf(b) {
  switch (b.type) {
    case 'tap': case 'toggle': case 'swipe': return [['trigger', 'key']];
    case 'joystick': return [['up','up'],['down','down'],['left','left'],['right','right']];
    case 'aim': return [['toggle', 'hold (optional)']];
    default: return [];
  }
}

/* ============================================================
   Markers
   ============================================================ */
let marks = [];
function placeMarkers() {
  for (const m of marks) m.remove();
  marks = [];
  link.innerHTML = '';
  const r = view.getBoundingClientRect();
  link.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
  link.setAttribute('width', r.width); link.setAttribute('height', r.height);

  for (const [name, b] of Object.entries(B)) {
    const pts = pointsOf(b);
    // Draw the direction arrow for a swipe: if the relation between the two
    // points is not visible, a profile swiping the wrong way goes unnoticed.
    if (b.type === 'swipe' && pts.length === 2) {
      const a = toScreen(b.from.x, b.from.y), c = toScreen(b.to.x, b.to.y);
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', a[0]); l.setAttribute('y1', a[1]);
      l.setAttribute('x2', c[0]); l.setAttribute('y2', c[1]);
      l.setAttribute('stroke', name === sel ? '#35d07f' : 'rgba(77,163,255,.6)');
      l.setAttribute('stroke-width', '2');
      l.setAttribute('stroke-dasharray', '6 4');
      link.appendChild(l);
    }
    if (b.type === 'joystick') {
      const c = toScreen(b.center.x, b.center.y);
      const ring = document.createElement('div');
      ring.className = 'ring';
      // The radius is normalized on the HORIZONTAL axis; vertically it is
      // scaled by the aspect ratio (the engine does the same). Drawing a
      // circle would be wrong: a real circle on screen is an ellipse in
      // normalized space.
      const d = b.radius * S.width * scale * 2;
      ring.style.width = d + 'px'; ring.style.height = d + 'px';
      ring.style.left = c[0] + 'px'; ring.style.top = c[1] + 'px';
      ov.appendChild(ring); marks.push(ring);
    }
    for (const [field, sub] of pts) {
      const p = b[field]; if (!p) continue;
      const s = toScreen(p.x, p.y);
      const m = document.createElement('div');
      const isSel = name === sel && (selPt === field || pts.length === 1);
      m.className = 'mk' + (isSel ? ' sel' : '');
      m.style.left = s[0] + 'px'; m.style.top = s[1] + 'px';
      m.innerHTML = `<div class="dot"></div><div class="tip">${name}${sub ? ' · ' + sub : ''}</div>`;
      m.onpointerdown = e => startDrag(e, m, name, field);
      ov.appendChild(m); marks.push(m);

      if (isSel) {
        for (const horiz of [true, false]) {
          const g = document.createElement('div');
          g.className = 'guide';
          if (horiz) { g.style.left = '0'; g.style.right = '0';
                       g.style.top = s[1] + 'px'; g.style.height = '1px'; }
          else { g.style.top = '0'; g.style.bottom = '0';
                 g.style.left = s[0] + 'px'; g.style.width = '1px'; }
          ov.appendChild(g); marks.push(g);
        }
      }
    }
  }
  updateReadout();
}

/* --- dragging + magnifier -------------------------------------
   The magnifier is mandatory: at fit scale one screen pixel covers 2-3
   source pixels and telling a button's edge apart by eye becomes
   impossible. It draws the source image at 8x with a crosshair, so you
   can see exactly where on the target you are pressing.               */
function startDrag(e, el, name, field) {
  e.preventDefault(); e.stopPropagation();
  select(name, field);
  el.setPointerCapture(e.pointerId);
  const r = view.getBoundingClientRect();
  const move = ev => {
    const [nx, ny] = toNorm(ev.clientX - r.left, ev.clientY - r.top);
    B[name][field] = { x: clamp01(nx), y: clamp01(ny) };
    dirty = true;
    // The list is DELIBERATELY not redrawn: rebuilding the whole sidebar
    // for every movement makes dragging stutter, and a stuttering drag
    // means an inaccurate coordinate.
    placeMarkers();
    showLoupe(ev.clientX - r.left, ev.clientY - r.top);
  };
  const up = () => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    loupe.style.display = 'none';
    renderList();   // the numeric boxes refresh only now
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  showLoupe(e.clientX - r.left, e.clientY - r.top);
}

const LOUPE_Z = 8;
function showLoupe(vx, vy) {
  if (!img.naturalWidth) return;
  const [nx, ny] = toNorm(vx, vy);
  const ix = nx * S.width, iy = ny * S.height;
  const half = loupe.width / (2 * LOUPE_Z);
  lctx.imageSmoothingEnabled = false;
  lctx.fillStyle = '#000';
  lctx.fillRect(0, 0, loupe.width, loupe.height);
  lctx.drawImage(img, ix - half, iy - half, half * 2, half * 2,
                 0, 0, loupe.width, loupe.height);
  lctx.strokeStyle = 'rgba(53,208,127,.95)'; lctx.lineWidth = 1;
  lctx.beginPath();
  lctx.moveTo(loupe.width / 2 + .5, 0); lctx.lineTo(loupe.width / 2 + .5, loupe.height);
  lctx.moveTo(0, loupe.height / 2 + .5); lctx.lineTo(loupe.width, loupe.height / 2 + .5);
  lctx.stroke();
  const r = view.getBoundingClientRect();
  // Keep the magnifier away from the cursor: on top of it, it hides the target.
  const lx = vx + 190 < r.width ? vx + 24 : vx - 204;
  const ly = vy + 100 < r.height ? vy - 90 : r.height - 190;
  loupe.style.left = Math.max(4, lx) + 'px';
  loupe.style.top = Math.max(4, ly) + 'px';
  loupe.style.display = 'block';
}

function updateReadout() {
  const b = sel && B[sel];
  if (!b) { $('#readout').textContent = '—'; return; }
  const pts = pointsOf(b);
  const f = selPt && b[selPt] ? selPt : (pts[0] && pts[0][0]);
  const p = f && b[f];
  if (!p) { $('#readout').textContent = sel; return; }
  $('#readout').innerHTML =
    `${sel}·${f} &nbsp; <b>${px(p.x, S.width)}</b>,<b>${px(p.y, S.height)}</b> px` +
    ` &nbsp; <span>(${p.x.toFixed(4)}, ${p.y.toFixed(4)})</span>`;
}

/* ============================================================
   Sidebar
   ============================================================ */
function select(name, field) {
  sel = name; selPt = field || (pointsOf(B[name] || {})[0] || [null])[0];
  renderList(); placeMarkers();
}

function pxRow(label, b, field, axis) {
  const size = axis === 'x' ? S.width : S.height;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${label}</label>`;
  const wrap = document.createElement('div'); wrap.className = 'xy';
  const box = document.createElement('div');
  const inp = document.createElement('input');
  inp.type = 'number'; inp.step = '1'; inp.min = '0'; inp.max = String(size);
  inp.value = px(b[field][axis], size);
  // Input in pixels: writing a normalized number is error-prone for humans,
  // while pixels are a unit you can count directly on the screenshot.
  inp.oninput = () => {
    const v = parseFloat(inp.value);
    if (!isFinite(v)) return;
    b[field][axis] = clamp01(v / size);
    dirty = true; placeMarkers(); updateReadout();
  };
  inp.onpointerdown = e => e.stopPropagation();
  box.appendChild(inp);
  const u = document.createElement('span'); u.textContent = 'px';
  box.appendChild(u);
  wrap.appendChild(box); row.appendChild(wrap);
  return row;
}

function numRow(label, obj, key, opts) {
  const o = opts || {};
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label}</label>`;
  const inp = document.createElement('input');
  inp.type = 'number';
  if (o.step != null) inp.step = String(o.step);
  if (o.min != null) inp.min = String(o.min);
  if (o.max != null) inp.max = String(o.max);
  inp.value = obj[key];
  inp.oninput = () => {
    const v = parseFloat(inp.value);
    if (isFinite(v)) { obj[key] = v; dirty = true; placeMarkers(); if (o.on) o.on(); }
  };
  inp.onpointerdown = e => e.stopPropagation();
  row.appendChild(inp);
  if (o.note) {
    const n = document.createElement('div'); n.className = 'val'; n.textContent = o.note;
    row.appendChild(n);
  }
  return row;
}

function boolRow(label, obj, key, note) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label}</label>`;
  const inp = document.createElement('input');
  inp.type = 'checkbox'; inp.checked = !!obj[key]; inp.style.width = 'auto';
  inp.onchange = () => { obj[key] = inp.checked; dirty = true; renderList(); };
  inp.onpointerdown = e => e.stopPropagation();
  row.appendChild(inp);
  if (note) { const n = document.createElement('div');
              n.className = 'val'; n.textContent = note; row.appendChild(n); }
  return row;
}

function keyRow(label, b, field) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label}</label>`;
  const btn = document.createElement('button');
  const t = b[field];
  // `toggle` is optional: leaving it empty is NOT an error, it means "aim is
  // always on". Colouring it as a warning sends the user hunting for a
  // problem that does not exist.
  const optional = field === 'toggle';
  btn.className = 'key' + (isUnset(t) && !optional ? ' none' : '');
  btn.textContent = optional && t == null ? 'none — always on' : trigLabel(t);
  btn.style.flex = '1';
  btn.onclick = e => { e.stopPropagation(); capture(label, t2 => {
    b[field] = t2; dirty = true; renderList(); }); };
  btn.onpointerdown = e => e.stopPropagation();
  row.appendChild(btn);
  if (field === 'toggle') {
    const clr = document.createElement('button');
    clr.textContent = '×'; clr.title = 'remove (aim becomes always on)';
    clr.onclick = e => { e.stopPropagation(); b.toggle = null; dirty = true; renderList(); };
    row.appendChild(clr);
  }
  return row;
}

let DUP = {};
function renderList() {
  const list = $('#list');
  const scroll = list.scrollTop;
  list.innerHTML = '';
  DUP = conflicts();
  const cbar = $('#conflict');
  const groups = Object.values(DUP);
  if (groups.length) {
    cbar.style.display = 'block';
    cbar.textContent = '⚠ the same key in more than one binding: ' +
      groups.map(g => g.join(' = ')).join('  ·  ');
  } else cbar.style.display = 'none';
  for (const name of Object.keys(B).sort()) {
    const b = B[name];
    const card = document.createElement('div');
    card.className = 'card' + (name === sel ? ' sel' : '');

    const top = document.createElement('div');
    top.className = 'top';
    top.onclick = () => select(name === sel ? null : name);

    // Name: CLICK TO EDIT. `prompt()` is ugly and blocked in some browsers;
    // renaming is a frequent action.
    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = name; nm.title = 'click to rename';
    nm.onclick = e => {
      e.stopPropagation();
      const inp = document.createElement('input');
      inp.className = 'nmedit'; inp.value = name;
      const commit = ok => {
        const v = inp.value.trim();
        if (!ok || !v || v === name) return renderList();
        if (B[v]) { flash(`the name '${v}' already exists`, true); return renderList(); }
        // Order is not preserved (BTreeMap already sorts by name); only the
        // key changes.
        B[v] = B[name]; delete B[name];
        if (sel === name) sel = v;
        dirty = true; renderList(); placeMarkers();
      };
      inp.onkeydown = ev => {
        ev.stopPropagation();
        if (ev.key === 'Enter') commit(true);
        else if (ev.key === 'Escape') commit(false);
      };
      inp.onblur = () => commit(true);
      inp.onclick = ev => ev.stopPropagation();
      nm.replaceWith(inp); inp.focus(); inp.select();
    };
    top.appendChild(nm);

    // Key badges: click to change without opening the card.
    const keys = document.createElement('div');
    keys.className = 'keys';
    for (const [f, lbl] of triggersOf(b)) {
      const t = b[f];
      const optional = f === 'toggle';
      if (optional && t == null) continue;   // empty is normal for aim
      const kb = document.createElement('span');
      const k = isUnset(t) ? null : JSON.stringify(t);
      kb.className = 'kb' + (isUnset(t) ? ' none' : '')
        + (k && DUP[k] ? ' dup' : '') + (optional ? ' opt' : '');
      kb.textContent = shortLabel(t);
      kb.title = lbl + ': ' + trigLabel(t)
        + (k && DUP[k] ? '  ⚠ collision: ' + DUP[k].join(', ') : '')
        + '  — click to change'
      kb.onclick = e => { e.stopPropagation();
        capture(name + ' · ' + lbl, t2 => { b[f] = t2; dirty = true; renderList(); }); };
      keys.appendChild(kb);
    }
    top.appendChild(keys);

    const tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = b.type;
    top.appendChild(tag);

    const x = document.createElement('button');
    x.className = 'xbtn'; x.textContent = '×'; x.title = 'sil';
    x.onclick = e => {
      e.stopPropagation();
      if (!confirm(`Delete the binding '${name}'?`)) return;
      delete B[name]; if (sel === name) sel = null;
      dirty = true; renderList(); placeMarkers();
    };
    top.appendChild(x);
    card.appendChild(top);

    const body = document.createElement('div');
    body.className = 'body';

    for (const [f, lbl] of triggersOf(b)) body.appendChild(keyRow(lbl, b, f));

    for (const [f, sub] of pointsOf(b)) {
      const h = document.createElement('div');
      h.className = 'row'; h.style.marginTop = '10px';
      h.innerHTML = `<label style="width:auto;color:var(--fg)">${sub || 'konum'}</label>`;
      const pick = document.createElement('button');
      pick.textContent = 'pick';
      pick.onclick = e => { e.stopPropagation(); select(name, f); };
      h.appendChild(pick);
      body.appendChild(h);
      body.appendChild(pxRow('X', b, f, 'x'));
      body.appendChild(pxRow('Y', b, f, 'y'));
    }

    if (b.type === 'joystick') {
      body.appendChild(numRow('radius', b, 'radius',
        { step: 0.005, min: 0.02, max: 0.5,
          note: Math.round(b.radius * S.width) + ' px' }));
    }
    if (b.type === 'swipe') {
      body.appendChild(numRow('duration (ms)', b, 'duration_ms', { step: 5, min: 5, max: 2000 }));
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = `<label>easing</label>`;
      const sl = document.createElement('select');
      for (const v of ['linear', 'ease_out', 'ease_out_strong']) {
        const o = document.createElement('option'); o.value = v; o.textContent = v;
        if (b.easing === v) o.selected = true; sl.appendChild(o);
      }
      sl.onchange = () => { b.easing = sl.value; dirty = true; };
      sl.onpointerdown = e => e.stopPropagation();
      r.appendChild(sl); body.appendChild(r);

      const g = document.createElement('div'); g.className = 'row';
      g.innerHTML = `<label>grup</label>`;
      const gi = document.createElement('input');
      gi.type = 'text'; gi.value = b.group || '';
      gi.placeholder = 'empty = not exclusive';
      gi.oninput = () => { b.group = gi.value.trim() || null; dirty = true; };
      gi.onpointerdown = e => e.stopPropagation();
      g.appendChild(gi); body.appendChild(g);
    }
    if (b.type === 'aim') {
      const note = document.createElement('div');
      note.className = 'hint';
      const upd = () => {
        const perCount = (b.sensitivity * S.width).toFixed(2);
        note.textContent = `1 mouse count = ${perCount} px` +
          (b.unbounded ? '  ·  unbounded: no recentring at the edge'
                       : '  ·  BOUNDED: the finger resets at the edge');
      };
      body.appendChild(numRow('hassasiyet', b, 'sensitivity',
        { step: 0.0001, min: 0.0001, max: 0.01, on: upd }));
      body.appendChild(note); upd();
      body.appendChild(boolRow('unbounded', b, 'unbounded',
        'may travel off-screen'));
      body.appendChild(numRow('emniyet', b, 'safety_span', { step: 1, min: 1, max: 256 }));
      body.appendChild(boolRow('nonlinear', b, 'nonlinear',
        'keep off — it shifts the feel'));
      const det = document.createElement('details');
      det.innerHTML = '<summary class="hint">bounded-mode fallback</summary>';
      det.appendChild(numRow('edge margin', b, 'recenter_margin',
        { step: 0.005, min: 0.01, max: 0.45 }));
      det.appendChild(numRow('press delay', b, 'reset_delay_ms',
        { step: 1, min: 0, max: 200 }));
      det.appendChild(boolRow('devir teslim', b, 'handoff'));
      det.appendChild(numRow('deadzone', b, 'deadzone', { step: 0.1, min: 0, max: 5 }));
      body.appendChild(det);
    }

    // Delete and rename now live in the HEADER: at the bottom of the card
    // users did not notice they existed.
    card.appendChild(body);
    list.appendChild(card);
  }
  list.scrollTop = scroll;
  updateReadout();
}

/* ============================================================
   Key capture
   ============================================================ */
let onCapture = null;
function capture(label, cb) {
  onCapture = cb;
  $('#gtitle').textContent = 'enter for ' + label;
  $('#grab').style.display = 'flex';
}
function endCapture(t) {
  $('#grab').style.display = 'none';
  const cb = onCapture; onCapture = null;
  if (cb && t) cb(t);
}
addEventListener('keydown', e => {
  if (onCapture) {
    e.preventDefault(); e.stopPropagation();
    if (e.code === 'Escape') return endCapture(null);
    const c = EVDEV[e.code];
    // Accepting an unknown key SILENTLY writes code 0 and the profile becomes
    // "I press the key but nothing happens". Say it.
    if (!c) { $('#gtitle').textContent = 'key not recognised: ' + e.code; return; }
    return endCapture({ Key: c });
  }
  nudge(e);
}, true);
$('#grab').addEventListener('pointerdown', e => {
  e.preventDefault();
  endCapture(['MouseLeft', 'MouseMiddle', 'MouseRight'][e.button] || null);
});
$('#grab').addEventListener('wheel', e => {
  e.preventDefault();
  endCapture(e.deltaY < 0 ? 'WheelUp' : 'WheelDown');
}, { passive: false });

/* --- fine tuning with arrow keys ------------------------------
   The step is EXACTLY 1 source pixel. Being independent of zoom
   matters: at fit scale you cannot target 1 pixel with the mouse,
   with an arrow key you always can.                              */
function nudge(e) {
  if (!sel || !B[sel]) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || '')) return;
  const b = B[sel];
  const f = selPt && b[selPt] ? selPt : (pointsOf(b)[0] || [null])[0];
  if (!f) return;
  const step = e.shiftKey ? 10 : 1;
  let dx = 0, dy = 0;
  if (e.code === 'ArrowLeft') dx = -step;
  else if (e.code === 'ArrowRight') dx = step;
  else if (e.code === 'ArrowUp') dy = -step;
  else if (e.code === 'ArrowDown') dy = step;
  else if ((e.code === 'BracketLeft' || e.code === 'BracketRight') && b.radius != null) {
    b.radius = Math.min(0.5, Math.max(0.02,
      b.radius + (e.code === 'BracketRight' ? 0.005 : -0.005)));
    e.preventDefault(); dirty = true; renderList(); placeMarkers(); return;
  } else return;
  e.preventDefault();
  b[f] = { x: clamp01(b[f].x + dx / S.width), y: clamp01(b[f].y + dy / S.height) };
  dirty = true; renderList(); placeMarkers();
}

/* ============================================================
   Stage interaction
   ============================================================ */
view.addEventListener('wheel', e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

/// Drag or click: movement below this threshold counts as a CLICK.
/// The distinction is mandatory — the same button both pans and places, and
/// getting it wrong either loses the point while panning or pans while clicking.
const CLICK_SLOP = 4;
view.addEventListener('pointerdown', e => {
  if (e.target.closest('.mk')) return;
  view.classList.add('pan');
  view.setPointerCapture(e.pointerId);
  const sx = e.clientX - tx, sy = e.clientY - ty;
  const ox = e.clientX, oy = e.clientY;
  let moved = 0;
  const mv = ev => {
    moved = Math.max(moved, Math.hypot(ev.clientX - ox, ev.clientY - oy));
    tx = ev.clientX - sx; ty = ev.clientY - sy; applyView();
  };
  const up = ev => {
    view.classList.remove('pan');
    view.removeEventListener('pointermove', mv);
    view.removeEventListener('pointerup', up);
    if (moved > CLICK_SLOP) return;
    // Click: move the selected point here. Finding the button by eye and
    // placing it with one click is the most common action.
    const b = sel && B[sel]; if (!b) return;
    const f = selPt && b[selPt] ? selPt : (pointsOf(b)[0] || [null])[0];
    if (!f) return;
    const r = view.getBoundingClientRect();
    const [nx, ny] = toNorm(ev.clientX - r.left, ev.clientY - r.top);
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;
    b[f] = { x: clamp01(nx), y: clamp01(ny) };
    dirty = true; renderList(); placeMarkers();
  };
  view.addEventListener('pointermove', mv);
  view.addEventListener('pointerup', up);
});
view.addEventListener('pointermove', e => {
  if (!S) return;
  const r = view.getBoundingClientRect();
  const [nx, ny] = toNorm(e.clientX - r.left, e.clientY - r.top);
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;
  $('#readout').innerHTML =
    `cursor &nbsp; <b>${px(nx, S.width)}</b>,<b>${px(ny, S.height)}</b> px` +
    ` &nbsp; <span>(${nx.toFixed(4)}, ${ny.toFixed(4)})</span>`;
});
view.addEventListener('pointerleave', updateReadout);

$('#fit').onclick = fitView;
$('#one').onclick = () => { const r = view.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 1 / scale); };
$('#zin').onclick = () => { const r = view.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 1.25); };
$('#zout').onclick = () => { const r = view.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 1 / 1.25); };

/* ============================================================
   Sunucu
   ============================================================ */
function flash(t, bad) {
  const m = $('#msg'); m.textContent = t; m.className = bad ? 'bad' : 'ok';
}

$('#add').onclick = () => {
  const name = $('#newname').value.trim();
  if (!name) return flash('ad gerekli', true);
  if (B[name]) return flash('bu ad zaten var', true);
  const t = $('#newtype').value;
  // A new point goes to the centre of the VISIBLE area. Using a fixed
  // 0.5,0.5 left the marker off-screen in a zoomed view and the user
  // could not find what they had added.
  const r = view.getBoundingClientRect();
  const [vx, vy] = toNorm(r.width / 2, r.height / 2);
  const c = { x: clamp01(vx), y: clamp01(vy) };
  const mk = {
    tap: () => ({ type: 'tap', trigger: UNSET(), at: { ...c } }),
    toggle: () => ({ type: 'toggle', trigger: UNSET(), at: { ...c } }),
    joystick: () => ({ type: 'joystick', up: UNSET(), down: UNSET(),
      left: UNSET(), right: UNSET(), center: { x: 0.15, y: 0.74 }, radius: 0.085 }),
    swipe: () => ({ type: 'swipe', trigger: UNSET(),
      from: { x: 0.5, y: 0.55 }, to: { x: 0.3, y: 0.55 },
      duration_ms: 45, group: null, easing: 'ease_out' }),
    // Unbounded aim default: the whole recentring mechanism is off.
    aim: () => ({ type: 'aim', toggle: null,
      origin: { x: 0.5004, y: 0.5 }, sensitivity: 0.0006, deadzone: 0.4,
      recenter_margin: 0.03, handoff: false, nonlinear: false,
      reset_delay_ms: 12, unbounded: true, safety_span: 32 }),
  }[t];
  B[name] = mk();
  $('#newname').value = '';
  dirty = true; select(name);
  // Ask for the key IMMEDIATELY: an unassigned binding blocks saving, and
  // forcing the user to come back later is a needless step.
  const first = triggersOf(B[name]).find(([f]) => f !== 'toggle');
  if (first) {
    capture(name + ' · ' + first[1], t2 => {
      B[name][first[0]] = t2; dirty = true; renderList();
      flash('added — set its position by dragging or clicking the image');
    });
  } else flash('eklendi — konumu ayarla');
};

async function doSave() {
  const missing = Object.entries(B).filter(([, b]) =>
    triggersOf(b).some(([f]) => f !== 'toggle' && isUnset(b[f]))).map(([n]) => n);
  if (missing.length) { flash('key unassigned: ' + missing.join(', '), true); return false; }
  const dups = Object.values(conflicts());
  if (dups.length) {
    flash('the same key in more than one binding: ' +
          dups.map(g => g.join(' = ')).join(', '), true);
    return false;
  }
  flash('kaydediliyor…');
  const r = await fetch('/save', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(B) });
  if (!r.ok) { flash('HATA: ' + await r.text(), true); return false; }
  dirty = false;
  return true;
}

$('#save').onclick = async () => {
  if (await doSave())
    flash('saved — to take effect use "Save and apply" or:\n' +
          'liw keymap stop && liw keymap start --grab');
};

// Save + restart the keymapper. In the edit-and-try loop
// terminale gitmek gerekmesin diye.
$('#apply').onclick = async () => {
  if (!await doSave()) return;
  flash('applying…');
  const r = await fetch('/apply', { method: 'POST' });
  flash(r.ok ? 'saved and applied — ' + await r.text()
             : 'saved but could not apply: ' + await r.text(), !r.ok);
};

$('#test').onclick = async () => {
  if (!sel || !B[sel]) return flash('select a binding first', true);
  const b = B[sel];
  const f = selPt && b[selPt] ? selPt : (pointsOf(b)[0] || [null])[0];
  if (!f) return flash('no touchable point for this type', true);
  const body = { x: b[f].x, y: b[f].y, hold_ms: 250 };
  if (b.type === 'swipe') { body.x = b.from.x; body.y = b.from.y;
                            body.to = [b.to.x, b.to.y]; body.hold_ms = b.duration_ms; }
  const r = await fetch('/poke', { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  flash(r.ok ? 'dokunuldu — oyunda tepki verdi mi?' : 'HATA: ' + await r.text(), !r.ok);
};

$('#reshot').onclick = async () => {
  flash('taking a screenshot…');
  const r = await fetch('/reshot', { method: 'POST' });
  if (!r.ok) return flash('HATA: ' + await r.text(), true);
  const j = await r.json();
  S.width = j.width; S.height = j.height; S.shot = j.shot;
  img.src = '/shot.png?v=' + j.shot;
  img.onload = () => { sizeCanvas(); fitView(); flash('image refreshed'); };
};

addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// `resize` IS NOT ENOUGH: when the tab opens in the background the window
// size never changes but `#view` goes from 0 to its real size. ResizeObserver
// sees exactly that transition.
new ResizeObserver(() => {
  if (!S) return;
  if (!fitted) fitView(); else placeMarkers();
}).observe(view);

function sizeCanvas() {
  img.width = S.width; img.height = S.height;
}

(async function boot() {
  S = await (await fetch('/state.json')).json();
  B = S.bindings;
  $('#pname').textContent = S.name;
  $('#ppkg').textContent = S.package;
  img.src = '/shot.png?v=' + S.shot;
  img.onload = () => { sizeCanvas(); fitView(); renderList(); };
  if (img.complete && img.naturalWidth) { sizeCanvas(); fitView(); renderList(); }
})();
</script></body></html>
