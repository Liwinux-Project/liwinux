[package]
name = "liw-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "liw_compositor"
path = "src/lib.rs"

[[bin]]
name = "liw-compositor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Only the Wayland server side. The default features drag in winit, udev and
# a renderer stack; none of that applies when the host application is the
# thing doing the drawing.
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }
