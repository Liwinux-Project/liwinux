[package]
name = "liw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "liw-ui"
path = "src/main.rs"

[dependencies]
liw-core = { version = "0.1.0", path = "../liw-core" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
liw-compositor = { path = "../liw-compositor" }
liw-input = { path = "../liw-input" }
toml = "0.9.8"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

# Pinned to the same Zed fork/rev postillion uses. gpui is Zed's internal
# framework, not a stable public API — that is why the rev is pinned rather
# than a version range, and why bumping it is a deliberate act.
gpui = { git = "https://github.com/WinTone01/zed", rev = "9ff17b7abd0a81a38f623cd1628208838acd661e" }
gpui_platform = { git = "https://github.com/WinTone01/zed", rev = "9ff17b7abd0a81a38f623cd1628208838acd661e", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/WinTone01/zed", rev = "9ff17b7abd0a81a38f623cd1628208838acd661e" }
