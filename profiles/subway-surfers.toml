# Subway Surfers — kaydırma tabanlı, joystick yok.
# Koordinatlar normalize (0..1): profil çözünürlükten bağımsız.
name = "Subway Surfers"
package = "com.kiloo.subwaysurf"

[bindings.sol]
type = "swipe"
trigger = { Key = 105 }          # KEY_LEFT
from = { x = 0.5, y = 0.5 }
to   = { x = 0.2, y = 0.5 }
duration_ms = 80

[bindings.sag]
type = "swipe"
trigger = { Key = 106 }          # KEY_RIGHT
from = { x = 0.5, y = 0.5 }
to   = { x = 0.8, y = 0.5 }
duration_ms = 80

[bindings.zipla]
type = "swipe"
trigger = { Key = 103 }          # KEY_UP
from = { x = 0.5, y = 0.6 }
to   = { x = 0.5, y = 0.3 }
duration_ms = 80

[bindings.kay]
type = "swipe"
trigger = { Key = 108 }          # KEY_DOWN
from = { x = 0.5, y = 0.4 }
to   = { x = 0.5, y = 0.7 }
duration_ms = 80
