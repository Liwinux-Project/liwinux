# Subway Surfers — WASD eşlemesi.
#
# Neden WASD: yön tuşları Waydroid/Android tarafından ZATEN oyuna iletiliyor.
# Onlarla test edersek tepkinin bizim enjeksiyonumuzdan mı yoksa yerleşik
# tuş yolundan mı geldiğini ayıramayız. WASD yerleşik olarak çalışmadığı için
# tepki alırsak kaynak kesin olarak bizim sanal dokunmatik ekranımızdır.
name = "Subway Surfers (WASD)"
package = "com.kiloo.subwaysurf"

[bindings.sol]
type = "swipe"
trigger = { Key = 30 }           # KEY_A
from = { x = 0.50, y = 0.55 }
to   = { x = 0.22, y = 0.55 }
duration_ms = 90

[bindings.sag]
type = "swipe"
trigger = { Key = 32 }           # KEY_D
from = { x = 0.50, y = 0.55 }
to   = { x = 0.78, y = 0.55 }
duration_ms = 90

[bindings.zipla]
type = "swipe"
trigger = { Key = 17 }           # KEY_W
from = { x = 0.50, y = 0.62 }
to   = { x = 0.50, y = 0.32 }
duration_ms = 90

[bindings.kay]
type = "swipe"
trigger = { Key = 31 }           # KEY_S
from = { x = 0.50, y = 0.38 }
to   = { x = 0.50, y = 0.68 }
duration_ms = 90
