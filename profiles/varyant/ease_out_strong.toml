# Subway Surfers — WASD.
#
# Tek parmakla oynanan bir oyun: dört kaydırma da "hareket" grubunda.
# Aynı gruptaki yeni jest, devam edeni İPTAL eder. Bu olmadan hızlı
# WASD basışlarında oyun iki ayrı parmak görüyor ve hareketler karışıyor.
#
# duration_ms düşük tutuldu: gerçek oyuncu hızlı kaydırır ve uzun jest
# bir sonraki tuşla çakışır. Çok düşürmek de olmaz — oyun jesti
# tanıyamayacak kadar az ara adım görür.
#
# easing = "ease_out": mesafenin %75'i sürenin ilk yarısında katedilir.
# Oyun kaydırma eşiğini daha erken aşar, yani daha erken tepki verir.
# Seçenekler: "linear" (varsayılan), "ease_out", "ease_out_strong".
name = "Subway Surfers (ease_out_strong)"
package = "com.kiloo.subwaysurf"

[bindings.sol]
type = "swipe"
trigger = { Key = 30 }           # KEY_A
from = { x = 0.50, y = 0.55 }
to   = { x = 0.22, y = 0.55 }
duration_ms = 45
group = "hareket"
easing = "ease_out_strong"

[bindings.sag]
type = "swipe"
trigger = { Key = 32 }           # KEY_D
from = { x = 0.50, y = 0.55 }
to   = { x = 0.78, y = 0.55 }
duration_ms = 45
group = "hareket"
easing = "ease_out_strong"

[bindings.zipla]
type = "swipe"
trigger = { Key = 17 }           # KEY_W
from = { x = 0.50, y = 0.62 }
to   = { x = 0.50, y = 0.32 }
duration_ms = 45
group = "hareket"
easing = "ease_out_strong"

[bindings.kay]
type = "swipe"
trigger = { Key = 31 }           # KEY_S
from = { x = 0.50, y = 0.38 }
to   = { x = 0.50, y = 0.68 }
duration_ms = 45
group = "hareket"
easing = "ease_out_strong"
