# Special Forces Group 2 — FPS eşlemesi.
#
# Koordinatlar oyun ekran görüntüsünden ölçüldü (2560x1440 tam ekran).
# Düğmelerin İŞLEVLERİ tahmin — hangi ikonun ne yaptığı doğrulanmalı.
#
# ÖNEMLİ: bu profil `--grab` ile kullanılmalı.
# persist.waydroid.fake_touch bu paket için AÇIK; kilit olmadan fare hem
# Waydroid'e (dokunma olarak) hem bize gider ve iki kez iş yapılır.
#   liw keymap start --grab
name = "Special Forces Group 2"
package = "com.ForgeGames.SpecialForcesGroup2"

# --- hareket: sol alttaki yön pedi ---
[bindings.hareket]
type = "joystick"
up    = { Key = 17 }             # W
down  = { Key = 31 }             # S
left  = { Key = 30 }             # A
right = { Key = 32 }             # D
center = { x = 0.148, y = 0.738 }
radius = 0.085

# --- bakış: fare (sınırsız — kenarda sıfırlama YOK) ---
#
# Bu bölüm baştan yazıldı. Eski hali "kenara gelince kaldır ve ortala"
# varsayımına dayanıyordu ve kullanıcının bildirdiği ÜÇ belirtinin de
# kaynağı oydu: fare bazen hiç algılanmıyor, bazen 2-3 saniye ölü kalıyor,
# bazen aim kayıyor. Gerekçe ve ölçüm: docs/fare-nisan.md
#
# unbounded: parmak ekranın DIŞINA çıkabilir. Waydroid'in dokunuş borusunda
#   kırpma yapan katman yok (çekirdek evdev devrede değil, TouchInputMapper
#   kırpmıyor, InputDispatcher MOVE'da pencere aramıyor). Parmak oyunun
#   içinde bir kez indikten sonra sınırsız düzlemde gezer; kaldırılmadığı
#   için oyunun takibi hiç kesilmez.
#   Yalnızca boru arka ucunda etkindir; uinput yoluna düşülürse motor
#   sessizce sınırlı kipe döner.
#
# origin: ekranın ORTASI — ama tam 0.50 değil, bir piksel sağı.
#
#   Neden ortada: sınırsız kipte iniş bir KEZ oluyor ve parmak oradan
#   sınırsız gezdiği için nokta yalnızca "oyun bunu bakış sayıyor mu"
#   sorusunu belirliyor. Ekranın ortası her yöne eşit görünür yol bırakıyor
#   ve dokunuş izini izlerken en okunaklısı bu.
#
#   Neden tam 0.50 DEĞİL: FPS'lerin çoğu bakış/yürüyüş ayrımını
#   `x > genişlik/2` ile yapar. 2560 pikselde 0.50 tam olarak 1280'dir ve
#   `1280 > 1280` yanlıştır — testi `>` ile yazan bir oyunda parmak sol
#   yarıya düşer, oyun onu hareket pedi sanır ve nişan komple ölür.
#   0.5004 × 2560 = 1281: gözle ortadan ayırt edilemez, sınırın doğru
#   tarafında. Çözünürlükten bağımsız çalışır çünkü oran hep merkezin
#   birkaç yüzde binlik sağında kalıyor.
#
#   Nişan oyun kipini açar açmaz HİÇ çalışmıyorsa bakılacak ilk yer burası:
#   0.60'a çekmek bakış bölgesini kesinleştirir.
#
# nonlinear: KAPALI. Açıkken hassasiyet parmağın merkeze uzaklığıyla
#   3 kata kadar değişiyordu. Aynı fare hareketi farklı açı döndürünce kas
#   hafızası kurulamıyor — "aim kayıyor" tam olarak buydu. Sıfırlama
#   olmadığı için asıl amacı (kenara varmayı geciktirmek) da anlamsız.
#
# sensitivity: 1 fare sayımı = 0.0006 ekran genişliği ≈ 1.5 piksel.
#   Sınırsız kipte bu SADECE his ayarıdır; hiçbir sıfırlama sıklığını
#   etkilemez. Oyun içi bakış hassasiyetini önce sabitle, sonra burayı
#   kendi DPI'ına göre ayarla.
#
# safety_span: taşma koruması, his değil. 32 ekran ≈ 82000 piksel; net
#   sürüklenme oraya varırsa fare İLK DURDUĞUNDA sessizce ortalanır.
#
# ÖNEMLİ: bu profil `--grab` ile kullanılmalı.
#   liw keymap start --grab
#
# `persist.waydroid.fake_touch` AÇIK KALSIN. Eski yorumda "kapatılmalı"
# yazıyordu; boru yoluna geçince yanlış oldu:
#
#   * fake_touch yeni dokunuş ÜRETMEZ. Yaptığı tek şey ViewRootImpl'e
#     ulaşan MotionEvent'lerin kaynağını SOURCE_TOUCHSCREEN'e (4098)
#     çevirmek (`0016-Fake-touch-inputs-for-select-apps.patch`). Bizim
#     enjekte ettiklerimiz zaten o kaynakta, yani üzerimizde etkisi yok.
#   * Oyun kipinde fare KİLİTLİ; Waydroid'e hiç fare olayı gitmiyor.
#     Kilitleyecek bir şey kalmıyor.
#   * Oyun kipi KAPALIYKEN fake_touch tam da gerektiği için lazım:
#     menülerdeki bazı UI öğeleri fareyle ancak böyle tıklanıyor.
#
# Ayrıca değeri çalışırken değiştirmenin bir anlamı yok: prop, pencere
# oluşturulurken `final` bir alana okunuyor. Oyun kipiyle birlikte açıp
# kapatmak çalışan oyunu ETKİLEMEZ (yalnızca sonradan açılan pencereleri),
# yani plasebo olurdu.
[bindings.bakis]
type = "aim"
origin = { x = 0.5004, y = 0.50 }
sensitivity = 0.0006
deadzone = 0.4
unbounded = true
safety_span = 32.0
nonlinear = false
# Aşağıdakiler yalnızca sınırlı kipe (uinput yoluna) düşülürse kullanılır.
recenter_margin = 0.03
handoff = false
reset_delay_ms = 12

# --- ateş: sağ üstteki nişangah dairesi ---
[bindings.ates]
type = "tap"
trigger = "MouseLeft"
at = { x = 0.938, y = 0.231 }

# --- ikinci nişangah (sol kenar) — muhtemelen alternatif ateş/nişan ---
[bindings.nisan]
type = "tap"
trigger = "MouseRight"
at = { x = 0.060, y = 0.396 }

# --- yan eğilme (hilal ikonlar) ---
[bindings.egil_sol]
type = "tap"
trigger = { Key = 16 }           # Q
at = { x = 0.273, y = 0.551 }

[bindings.egil_sag]
type = "tap"
trigger = { Key = 18 }           # E
at = { x = 0.783, y = 0.551 }

# --- silah değiştir (sağdaki oklu tüfek ikonu) ---
[bindings.silah]
type = "tap"
trigger = { Key = 19 }           # R
at = { x = 0.958, y = 0.662 }

# --- duruş: sağ alttaki iki asker ikonu (çömel / yat) ---
[bindings.comel]
type = "tap"
trigger = { Key = 29 }           # LEFTCTRL
at = { x = 0.833, y = 0.924 }

[bindings.yat]
type = "tap"
trigger = { Key = 42 }           # LEFTSHIFT
at = { x = 0.950, y = 0.924 }

# --- market (sol üst alışveriş sepeti) ---
[bindings.market]
type = "tap"
trigger = { Key = 33 }           # F
at = { x = 0.151, y = 0.264 }

# --- skor tablosu (alt orta liste ikonu) ---
[bindings.skor]
type = "tap"
trigger = { Key = 15 }           # TAB
at = { x = 0.325, y = 0.920 }
