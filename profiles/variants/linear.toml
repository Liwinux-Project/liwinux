# Subway Surfers — WASD.
#
# A single-finger game: all four swipes are in the "movement" group.
# A new gesture in the same group CANCELS the running one. Without that, rapid
# WASD presses make the game see two separate fingers and the movements get
# confused.
#
# duration_ms is kept low: a real player swipes fast and a long gesture collides
# with the next key. It must not be too low either — the game would see too few
# intermediate steps to recognise the gesture.
#
# easing = "linear": constant speed; the reference for comparison.
# Options: "linear" (default), "ease_out", "ease_out_strong".
name = "Subway Surfers (linear)"
package = "com.kiloo.subwaysurf"

[bindings.left]
type = "swipe"
trigger = { Key = 30 }           # KEY_A
from = { x = 0.50, y = 0.55 }
to   = { x = 0.22, y = 0.55 }
duration_ms = 45
group = "movement"
easing = "linear"

[bindings.right]
type = "swipe"
trigger = { Key = 32 }           # KEY_D
from = { x = 0.50, y = 0.55 }
to   = { x = 0.78, y = 0.55 }
duration_ms = 45
group = "movement"
easing = "linear"

[bindings.jump]
type = "swipe"
trigger = { Key = 17 }           # KEY_W
from = { x = 0.50, y = 0.62 }
to   = { x = 0.50, y = 0.32 }
duration_ms = 45
group = "movement"
easing = "linear"

[bindings.roll]
type = "swipe"
trigger = { Key = 31 }           # KEY_S
from = { x = 0.50, y = 0.38 }
to   = { x = 0.50, y = 0.68 }
duration_ms = 45
group = "movement"
easing = "linear"
