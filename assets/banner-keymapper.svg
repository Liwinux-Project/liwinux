<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="liw-input — the keyboard and mouse to Android touch mapping engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc65c"/><stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>

  <!-- mark -->
  <g transform="translate(20 32) scale(0.5)">
    <path d="M140 108 v 252 a 8 8 0 0 0 8 8 h 236"
          fill="none" stroke="url(#amber)" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M192 314 L222 314 L240 306 L262 314 L284 310 L306 158 L326 314 L352 306 L380 314"
          fill="none" stroke="#4fd1c5" stroke-width="19"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="292" y="158" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#f2f4fa" letter-spacing="-2">liw-input</text>
  <text x="294" y="206" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="27" fill="#9aa4c0">Keyboard and mouse to Android touch — the mapping engine.</text>

  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="21" fill="#6f7ba0">
    <rect x="294" y="238" width="150" height="40" rx="10" fill="#1b2030" stroke="#333c54"/>
    <text x="314" y="264" fill="#4fd1c5">no D-Bus</text>
    <rect x="458" y="238" width="176" height="40" rx="10" fill="#1b2030" stroke="#333c54"/>
    <text x="478" y="264" fill="#ffc65c">118 tests</text>
    <rect x="648" y="238" width="196" height="40" rx="10" fill="#1b2030" stroke="#333c54"/>
    <text x="668" y="264" fill="#9aa4c0">pure engine</text>
  </g>
</svg>
