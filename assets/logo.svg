<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="liwinux logo: an L forming the axes of a frame-time chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc65c"/><stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#3a4258" stroke-width="3"/>

  <!-- The L is also the axes of a chart. -->
  <path d="M140 108 v 252 a 8 8 0 0 0 8 8 h 236"
        fill="none" stroke="url(#amber)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A frame-time trace: steady, with one jank spike. Measure first. -->
  <path d="M192 314 L222 314 L240 306 L262 314 L284 310 L306 158 L326 314 L352 306 L380 314"
        fill="none" stroke="#4fd1c5" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
