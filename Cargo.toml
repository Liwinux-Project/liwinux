[workspace]
resolver = "3"
members = ["crates/liw-input", "crates/liw-ui", "crates/liw-core", "crates/liwd", "crates/liw", "crates/liwd-helper"]

# A bare `cargo build` skips the UI.
#
# liw-ui pulls gpui from a Zed fork — 80-odd crates including blade and wgpu,
# and a first build measured in minutes. Nobody working on the daemon, the
# input engine or the CLI needs any of it: `cargo build -p liwd` already
# pulls zero gpui artifacts, so the only thing paying that cost was building
# the workspace root out of habit.
#
# The trade is that a bare build no longer notices a broken UI, so anything
# that verifies the tree must say `--workspace` explicitly. CI does.
default-members = [
    "crates/liw-core",
    "crates/liw-input",
    "crates/liwd",
    "crates/liwd-helper",
    "crates/liw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Liwinux-Project/liwinux"
